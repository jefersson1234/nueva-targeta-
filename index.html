<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Corazón ❤️</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="pagina">
        <div class="luz"></div>
        <div class="luz"></div>
        <div class="luz"></div>

        <div id="indicadorControl" class="indicador-control">
            <span class="icono-girar">🔄</span> Arrastra para girar en 3D
        </div>

        <div id="tarjeta" class="tarjeta">
            <div class="tarjeta-cuerpo">
                <div class="tarjeta-cara tarjeta-frente">
                    <div class="portada-ornamentos" aria-hidden="true">
                        <div class="anillo anillo-1"></div>
                        <div class="anillo anillo-2"></div>
                        <div class="anillo anillo-3"></div>
                    </div>

                    <div class="portada-texto">
                        <p class="portada-etiqueta">Una galaxia especial</p>
                        <h2>Eres mi universo entero</h2>
                        <p class="portada-mensaje">Cada estrella brilla más desde que te conocí</p>
                    </div>

                    <div id="corazonContenedor">
                        <div class="corazon-halo"></div>
                        <div id="corazon"></div>
                        <div id="instruccion">TOCA EL CORAZÓN</div>
                        <div id="indicadorMusica" aria-hidden="true"></div>
                    </div>
                </div>

                <div class="tarjeta-cara tarjeta-reverso">
                    <div class="reverso-ornamentos" aria-hidden="true">
                        <div class="anillo anillo-1"></div>
                        <div class="anillo anillo-2"></div>
                    </div>
                    <div class="reverso-contenido">
                        <div class="reverso-icono">✨</div>
                        <h3>Universo de Amor</h3>
                        <p class="reverso-frase">"En cualquier ángulo del universo, mi lugar favorito siempre es a tu lado."</p>
                        <div class="reverso-detalles">
                            <span class="corazon-mini-sparkle">💖</span>
                            <span class="corazon-mini-sparkle">✨</span>
                            <span class="corazon-mini-sparkle">💖</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="escena2">
            <div id="estrellas"></div>
            <h1 id="titulo">Para ti ❤️</h1>

            <button id="volver">Volver ❤️</button>

            <div id="arbol">
                <div class="tronco"></div>
                <div class="rama rama1"></div>
                <div class="rama rama2"></div>
                <div class="rama rama3"></div>
                <div class="rama rama4"></div>
            </div>

            <div id="corazonOrbital">
                <div class="corazon-central">♥</div>
                <div id="frasesOrbital"></div>
            </div>

            <div id="galeria">
                <img class="foto" src="imagenes/foto1.jpg" alt="Foto 1">
                <img class="foto" src="imagenes/foto2.jpg" alt="Foto 2">
                <img class="foto" src="imagenes/foto3.jpg" alt="Foto 3">
                <img class="foto" src="imagenes/foto4.jpg" alt="Foto 4">
            </div>
        </div>
    </div>

    <audio id="musica" loop>
        <source src="musica/musica.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
